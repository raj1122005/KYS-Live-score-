<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalibari Cricket Tournament Live Score</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b132b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #1c2541; padding: 30px; border-radius: 16px; text-align: center; width: 100%; max-width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); border: 1px solid #3a506b; }
    .tournament-badge { display: inline-block; background: #48bfe3; color: #0b132b; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; margin-bottom: 12px; }
    .match-title { font-size: 1.3rem; font-weight: 600; color: #f1f5f9; margin-bottom: 20px; }
    .score-container { background: #0b132b; padding: 15px; border-radius: 10px; margin: 15px 0; }
    .score { font-size: 3.5rem; font-weight: 800; color: #48bfe3; margin: 0; }
    .overs { font-size: 1.2rem; color: #cbd5e1; margin-top: 5px; }
    .status { margin-top: 15px; padding: 10px; background: #3a506b; border-radius: 8px; font-size: 0.95rem; color: #5bc0be; font-weight: 500; }
  </style>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <div class="tournament-badge">LIVE MATCH</div>
    <div class="match-title" id="teams">Loading Match...</div>
    <div class="score-container">
      <div class="score" id="score">0 / 0</div>
      <div class="overs" id="overs">Overs: 0.0</div>
    </div>
    <div class="status" id="status">Waiting for updates...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCP330qxLvWwAS_ycpRJS7QS4pBD2fgxo4",
      authDomain: "kalibari-cricket-turnament2026.firebaseapp.com",
      databaseURL: "https://kalibari-cricket-turnament2026-default-rtdb.firebaseio.com",
      projectId: "kalibari-cricket-turnament2026",
      storageBucket: "kalibari-cricket-turnament2026.firebasestorage.app",
      messagingSenderId: "927915044318",
      appId: "1:927915044318:web:febe5f2b1212da85d9414f",
      measurementId: "G-D3GGN03YDV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("liveMatch").on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById("teams").innerText = `${data.teamA} vs ${data.teamB}`;
        document.getElementById("score").innerText = `${data.runs} / ${data.wickets}`;
        document.getElementById("overs").innerText = `Overs: ${data.overs}`;
        document.getElementById("status").innerText = data.status || "Match Ongoing";
      }
    });
  </script>
</body>
</html>
