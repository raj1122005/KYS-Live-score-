<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALIBARI CRICKET TURNAMENT 2026 - Live Score</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b132b; color: #fff; min-height: 100vh; padding: 15px; display: flex; justify-content: center; align-items: flex-start; }
    .scoreboard { width: 100%; max-width: 480px; background: #1c2541; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3a506b; }
    
    /* Header */
    .header { background: linear-gradient(135deg, #1e3a8a, #0284c7); padding: 16px; text-align: center; }
    .org-name { font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; color: #bae6fd; font-weight: 700; margin-bottom: 4px; }
    .tour-title { font-size: 1.25rem; font-weight: 800; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .match-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: #e0f2fe; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); }
    
    /* Score Area */
    .score-card { padding: 20px; text-align: center; background: #111c38; }
    .teams-line { font-size: 1.2rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
    .main-score { font-size: 3.8rem; font-weight: 900; color: #38bdf8; line-height: 1; margin: 10px 0; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    .overs-rate { font-size: 1.05rem; color: #94a3b8; font-weight: 600; }
    .overs-rate span { color: #f1f5f9; font-weight: 700; }
    
    /* Target Box */
    .target-box { background: rgba(56, 189, 248, 0.08); border: 1px dashed #0284c7; border-radius: 10px; padding: 10px; margin-top: 12px; display: none; }
    .target-score { font-size: 0.95rem; font-weight: 800; color: #38bdf8; }
    .equation-score { font-size: 0.95rem; font-weight: 700; color: #fde047; margin-top: 3px; }

    /* This Over */
    .this-over { padding: 12px 18px; background: #16203d; border-top: 1px solid #283756; border-bottom: 1px solid #283756; display: flex; align-items: center; justify-content: space-between; }
    .this-over-title { font-size: 0.85rem; font-weight: bold; color: #94a3b8; }
    .balls-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
    .ball-dot { width: 28px; height: 28px; border-radius: 50%; background: #334155; color: #fff; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    .ball-dot.four { background: #15803d; }
    .ball-dot.six { background: #7e22ce; }
    .ball-dot.wicket { background: #b91c1c; }
    .ball-dot.extra { background: #d97706; }

    /* Player Stats Table */
    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
    .stats-table th { background: #0f172a; color: #94a3b8; padding: 8px 14px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    .stats-table td { padding: 10px 14px; border-top: 1px solid #22304e; color: #e2e8f0; }
    .stats-table .striker { color: #38bdf8; font-weight: bold; }

    /* Officials */
    .officials { padding: 12px 18px; font-size: 0.82rem; color: #94a3b8; background: #0f172a; border-top: 1px solid #22304e; }
    .officials span { color: #f1f5f9; font-weight: 600; }

    /* Match Status */
    .status-bar { padding: 10px 15px; text-align: center; background: #0369a1; color: #fff; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.5px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="scoreboard">
    <!-- Header -->
    <div class="header">
      <div class="org-name">KALIBARI YUBA SANGHA</div>
      <div class="tour-title">KALIBARI CRICKET TURNAMENT 2026</div>
      <div class="match-meta">
        <span id="matchType">Match: Final</span>
        <span id="matchNo">Match #1</span>
      </div>
    </div>

    <!-- Main Score Display -->
    <div class="score-card">
      <div class="teams-line" id="teams">Team A vs Team B</div>
      <div class="main-score" id="score">0/0</div>
      <div class="overs-rate">Overs: <span id="overs">0.0</span> / <span id="maxOvers">7</span> | CRR: <span id="crr">0.0</span></div>

      <!-- Target Equation -->
      <div class="target-box" id="targetBox">
        <div class="target-score" id="targetScore">Target: 0</div>
        <div class="equation-score" id="equation">Need 0 runs in 0 balls</div>
      </div>
    </div>

    <!-- This Over Balls -->
    <div class="this-over">
      <div class="this-over-title">THIS OVER</div>
      <div class="balls-wrap" id="thisOverBalls">
        <div class="ball-dot">-</div>
      </div>
    </div>

    <!-- Batting & Bowling Stats -->
    <table class="stats-table">
      <thead>
        <tr>
          <th>Batter</th>
          <th style="text-align: right;">R (B)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="bat1Name" class="striker">Batter 1 *</td>
          <td style="text-align: right;" id="bat1Stats">0 (0)</td>
        </tr>
        <tr>
          <td id="bat2Name">Batter 2</td>
          <td style="text-align: right;" id="bat2Stats">0 (0)</td>
        </tr>
      </tbody>
      <thead>
        <tr>
          <th>Bowler</th>
          <th style="text-align: right;">O - R - W</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td id="bowlerName" style="color: #fde047; font-weight: bold;">Bowler</td>
          <td style="text-align: right;" id="bowlerStats">0.0 - 0 - 0</td>
        </tr>
      </tbody>
    </table>

    <!-- Umpires -->
    <div class="officials">
      Umpires: <span id="ump1">Umpire 1</span> & <span id="ump2">Umpire 2</span>
    </div>

    <!-- Status Strip -->
    <div class="status-bar" id="matchStatus">Match In Progress</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCP330qxLvWwAS_ycpRJS7QS4pBD2fgxo4",
      authDomain: "kalibari-cricket-turnament2026.firebaseapp.com",
      databaseURL: "https://kalibari-cricket-turnament2026-default-rtdb.firebaseio.com",
      projectId: "kalibari-cricket-turnament2026",
      storageBucket: "kalibari-cricket-turnament2026.firebasestorage.app",
      messagingSenderId: "927915044318",
      appId: "1:927915044318:web:febe5f2b1212da85d9414f",
      measurementId: "G-D3GGN03YDV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("liveMatch").on("value", (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById("matchNo").innerText = `Match #${data.matchNo || 1}`;
      document.getElementById("matchType").innerText = `Stage: ${data.matchType || "League"}`;
      document.getElementById("teams").innerText = `${data.battingTeam || "Team A"} vs ${data.bowlingTeam || "Team B"}`;
      document.getElementById("score").innerText = `${data.runs || 0}/${data.wickets || 0}`;
      document.getElementById("overs").innerText = data.overs || "0.0";
      document.getElementById("maxOvers").innerText = data.totalOvers || 7;

      // CRR Calculation
      const parts = (data.overs || "0.0").split(".");
      const legalBalls = (parseInt(parts[0]) || 0) * 6 + (parseInt(parts[1]) || 0);
      const crr = legalBalls > 0 ? ((data.runs / legalBalls) * 6).toFixed(2) : "0.0";
      document.getElementById("crr").innerText = crr;

      // Batters & Bowler
      document.getElementById("bat1Name").innerText = (data.bat1Name || "Batter 1") + " *";
      document.getElementById("bat1Stats").innerText = `${data.bat1Runs || 0} (${data.bat1Balls || 0})`;
      document.getElementById("bat2Name").innerText = data.bat2Name || "Batter 2";
      document.getElementById("bat2Stats").innerText = `${data.bat2Runs || 0} (${data.bat2Balls || 0})`;
      document.getElementById("bowlerName").innerText = data.bowlerName || "Bowler";
      document.getElementById("bowlerStats").innerText = `${data.bowlerOvers || "0.0"} - ${data.bowlerRuns || 0} - ${data.bowlerWkts || 0}`;

      // Umpires & Status
      document.getElementById("ump1").innerText = data.umpire1 || "Umpire 1";
      document.getElementById("ump2").innerText = data.umpire2 || "Umpire 2";
      document.getElementById("matchStatus").innerText = data.status || "Match Ongoing";

      // This Over Balls Display
      const overWrap = document.getElementById("thisOverBalls");
      overWrap.innerHTML = "";
      const balls = data.thisOver ? data.thisOver.trim().split(" ") : [];
      if (balls.length === 0 || balls[0] === "") {
        overWrap.innerHTML = '<div class="ball-dot">-</div>';
      } else {
        balls.forEach(b => {
          let dot = document.createElement("div");
          dot.className = "ball-dot";
          dot.innerText = b;
          if (b === "4") dot.classList.add("four");
          else if (b === "6") dot.classList.add("six");
          else if (b === "W") dot.classList.add("wicket");
          else if (b.includes("Wd") || b.includes("Nb")) dot.classList.add("extra");
          overWrap.appendChild(dot);
        });
      }

      // Target Equation
      const targetBox = document.getElementById("targetBox");
      if (data.target && Number(data.target) > 0) {
        targetBox.style.display = "block";
        document.getElementById("targetScore").innerText = `Target: ${data.target}`;
        const totalBalls = (Number(data.totalOvers) || 7) * 6;
        const ballsRemaining = Math.max(0, totalBalls - legalBalls);
        const runsNeeded = Math.max(0, Number(data.target) - Number(data.runs));

        if (Number(data.runs) >= Number(data.target)) {
          document.getElementById("equation").innerText = `${data.battingTeam} won the match! 🎉`;
        } else if (ballsRemaining === 0) {
          document.getElementById("equation").innerText = `Innings Over!`;
        } else {
          document.getElementById("equation").innerText = `Need ${runsNeeded} runs in ${ballsRemaining} balls to win`;
        }
      } else {
        targetBox.style.display = "none";
      }
    });
  </script>
</body>
</html>
