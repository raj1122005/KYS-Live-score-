<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYS Admin Controller</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #050d1a; color: #f1f5f9; padding: 10px; margin: 0; display: flex; justify-content: center; }
    .panel { background: #0c182b; border: 1px solid #1e3a5f; border-radius: 14px; width: 100%; max-width: 480px; padding: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    h2 { color: #34d399; text-align: center; margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 800; }
    .auth-box { text-align: center; padding: 50px 15px; }
    label { font-size: 0.72rem; font-weight: 800; color: #94a3b8; display: block; margin-top: 8px; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 9px; margin-top: 3px; background: #070e1a; border: 1px solid #233c5e; border-radius: 6px; color: #fff; font-size: 0.9rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 8px 0; }
    button { padding: 9px 3px; background: #13243d; color: #fff; border: 1px solid #1e3a5f; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    button:active { background: #059669; }

    .btn-switch { background: #0284c7 !important; border-color: #38bdf8 !important; width: 100%; margin-top: 6px; padding: 9px; font-weight: 800; }
    .btn-undo { background: #d97706 !important; border-color: #f59e0b !important; grid-column: span 2; }
    .btn-wicket { background: #991b1b !important; border-color: #ef4444 !important; grid-column: span 2; }
    .btn-over { background: #065f46 !important; border-color: #10b981 !important; grid-column: span 2; }
    .btn-break { background: #ca8a04 !important; border-color: #eab308 !important; grid-column: span 2; }

    .btn-save { width: 100%; background: #059669; border-color: #10b981; padding: 13px; font-size: 1.05rem; margin-top: 14px; font-weight: 900; }
    .btn-reset { width: 100%; background: #334155; border: none; margin-top: 8px; padding: 7px; font-size: 0.8rem; }

    /* Schedule Management Card */
    .sch-item { background: #070e1a; border: 1px solid #1e3a5f; border-radius: 8px; padding: 8px; margin-top: 6px; }
    .sch-item-top { display: flex; justify-content: space-between; font-size: 0.8rem; color: #fde047; font-weight: bold; }
    .sch-btns { display: flex; gap: 5px; margin-top: 6px; }
    .sch-btns button { flex: 1; padding: 5px; font-size: 0.75rem; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Clean PIN Screen -->
  <div id="loginScreen" class="panel auth-box">
    <h2 style="font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 20px;">PIN</h2>
    <input type="password" id="passInput" placeholder="••••••" style="text-align: center; font-size: 1.5rem; letter-spacing: 6px; margin-bottom: 20px; width: 80%;">
    <button style="width: 80%; padding: 12px; background: #059669; font-size: 1.1rem;" onclick="verifyPin()">OK</button>
  </div>

  <!-- Admin Controller -->
  <div id="adminPanel" class="panel" style="display: none;">
    <h2>KYS Match Controller</h2>

    <!-- Match Pre-start & Countdown Control -->
    <div style="background: #06101d; padding: 10px; border-radius: 8px; border: 1px solid #1e3a5f; margin-bottom: 8px;">
      <span style="font-size: 0.8rem; font-weight: bold; color: #38bdf8;">⏳ MATCH START TIME & COUNTDOWN</span>
      <label>Scheduled Start Time</label>
      <input type="datetime-local" id="startTime">
      
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
        <input type="checkbox" id="matchStarted" style="width: 20px; height: 20px;">
        <label for="matchStarted" style="font-size: 0.85rem; color: #fde047; margin: 0; cursor: pointer;">Match Suru Hoye Geche (Hide Countdown)</label>
      </div>
    </div>

    <!-- Match Meta -->
    <div class="row">
      <div>
        <label>Match Type</label>
        <select id="matchType">
          <option value="League Match">League Match</option>
          <option value="Quarter Final">Quarter Final</option>
          <option value="Semi Final">Semi Final</option>
          <option value="Final">Grand Final</option>
        </select>
      </div>
      <div>
        <label>Match No.</label>
        <input type="number" id="matchNo" value="1">
      </div>
    </div>

    <label>Toss Details</label>
    <input type="text" id="toss" value="Team Alpha won the toss & elected to bat">

    <div class="row">
      <div>
        <label>Batting Team</label>
        <input type="text" id="battingTeam" value="Team Alpha">
      </div>
      <div>
        <label>Bowling Team</label>
        <input type="text" id="bowlingTeam" value="Team Bravo">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Target (2nd Inn)</label>
        <input type="number" id="target" placeholder="Blank if 1st Inn">
      </div>
      <div>
        <label>Total Overs</label>
        <input type="number" id="totalOvers" value="7">
      </div>
    </div>

    <!-- Batter Strike Management -->
    <div style="background: #06101d; padding: 8px; border-radius: 8px; margin-top: 8px; border: 1px solid #1e293b;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.75rem; font-weight: bold; color: #34d399;">BATTER ROTATION</span>
        <span id="activeStrikerLabel" style="font-size: 0.75rem; color: #fde047; font-weight: bold;">Batter 1 on Strike</span>
      </div>

      <div class="row" style="margin-top: 4px;">
        <div>
          <label>Batter 1 (Name)</label>
          <input type="text" id="bat1Name" value="Batter 1">
          <div style="display: flex; gap: 4px; margin-top: 3px;">
            <input type="number" id="bat1Runs" placeholder="R" value="0">
            <input type="number" id="bat1Balls" placeholder="B" value="0">
          </div>
        </div>
        <div>
          <label>Batter 2 (Name)</label>
          <input type="text" id="bat2Name" value="Batter 2">
          <div style="display: flex; gap: 4px; margin-top: 3px;">
            <input type="number" id="bat2Runs" placeholder="R" value="0">
            <input type="number" id="bat2Balls" placeholder="B" value="0">
          </div>
        </div>
      </div>
      <button class="btn-switch" onclick="switchStrike()">🔄 Switch Strike</button>
    </div>

    <!-- Current Bowler -->
    <div class="row">
      <div>
        <label>Current Bowler</label>
        <input type="text" id="bowlerName" value="Bowler">
      </div>
      <div>
        <label>Bowler (O - R - W)</label>
        <div style="display: flex; gap: 2px;">
          <input type="text" id="bowlerOvers" placeholder="O" value="0.0">
          <input type="number" id="bowlerRuns" placeholder="R" value="0">
          <input type="number" id="bowlerWkts" placeholder="W" value="0">
        </div>
      </div>
    </div>

    <!-- Ball Actions -->
    <label>Ball Actions</label>
    <div class="grid-btns">
      <button onclick="ballEvent(0, '0')">Dot (0)</button>
      <button onclick="ballEvent(1, '1', true)">+1 (Rot)</button>
      <button onclick="ballEvent(2, '2')">+2</button>
      <button onclick="ballEvent(3, '3', true)">+3 (Rot)</button>
      <button onclick="ballEvent(4, '4')">+4 Four</button>
      <button onclick="ballEvent(6, '6')">+6 Six</button>
      <button onclick="extraEvent(1, 'Wd')">Wide (+1)</button>
      <button onclick="extraEvent(1, 'Nb')">NoBall (+1)</button>
    </div>

    <!-- Undo, Wicket & Over Buttons -->
    <div class="grid-btns">
      <button class="btn-undo" onclick="undoLastAction()">↩️ Undo Last Ball</button>
      <button class="btn-wicket" onclick="wicketEvent()">Out / Wicket (W)</button>
    </div>

    <div class="grid-btns">
      <button class="btn-over" onclick="overCompleteEvent()">Over End (Save Over)</button>
      <button class="btn-break" onclick="setInningsBreak()">⏸️ 1st Innings Break</button>
    </div>

    <div class="row">
      <div>
        <label>Total Runs</label>
        <input type="number" id="runs" value="0">
      </div>
      <div>
        <label>Total Wickets</label>
        <input type="number" id="wickets" value="0">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Overs (e.g. 3.2)</label>
        <input type="text" id="overs" value="0.0">
      </div>
      <div>
        <label>This Over Balls</label>
        <input type="text" id="thisOver" placeholder="0 1 4 W">
      </div>
    </div>

    <!-- Umpires Section -->
    <div class="row">
      <div>
        <label>Umpire 1</label>
        <input type="text" id="umpire1" placeholder="Umpire 1 Name">
      </div>
      <div>
        <label>Umpire 2</label>
        <input type="text" id="umpire2" placeholder="Umpire 2 Name">
      </div>
    </div>

    <!-- FULL SCHEDULE MANAGER -->
    <div style="background: #06101d; padding: 10px; border-radius: 8px; border: 1px solid #1e3a5f; margin-top: 10px;">
      <span style="font-size: 0.85rem; font-weight: bold; color: #10b981;">📅 MATCH SCHEDULE MANAGER</span>
      
      <div class="row" style="margin-top: 6px;">
        <div>
          <label>Match No.</label>
          <input type="number" id="schMatchNo" placeholder="2">
        </div>
        <div>
          <label>Stage / Type</label>
          <input type="text" id="schType" placeholder="League / Semi Final">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Team 1</label>
          <input type="text" id="schTeamA" placeholder="Team 1">
        </div>
        <div>
          <label>Team 2</label>
          <input type="text" id="schTeamB" placeholder="Team 2">
        </div>
      </div>
      <label>Scheduled Time / Date</label>
      <input type="text" id="schTimeStr" placeholder="e.g. Today 2:30 PM">
      <button style="width: 100%; margin-top: 8px; background: #0284c7; padding: 10px;" onclick="addMatchSchedule()">➕ Add To Schedule</button>

      <!-- Existing Schedules List With Controls -->
      <label style="margin-top: 14px; color: #fde047;">Current Scheduled Matches</label>
      <div id="adminScheduleList" style="margin-top: 4px;">
        <div style="font-size: 0.75rem; color: #64748b; text-align: center; padding: 6px;">Loading schedule records...</div>
      </div>
    </div>

    <!-- 9 Players Squad List -->
    <div class="row" style="margin-top: 8px;">
      <div>
        <label>Batting Team (9 Players)</label>
        <textarea id="squadA" rows="4" placeholder="1. Player&#10;2. Player&#10;..."></textarea>
      </div>
      <div>
        <label>Bowling Team (9 Players)</label>
        <textarea id="squadB" rows="4" placeholder="1. Player&#10;2. Player&#10;..."></textarea>
      </div>
    </div>

    <label>Match Status Note</label>
    <input type="text" id="status" value="Match In Progress">

    <button class="btn-save" onclick="updateScore()">⚡ Push Live Score</button>
    <button class="btn-reset" onclick="resetNewMatch()">🔄 Start New Match (Reset All)</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCP330qxLvWwAS_ycpRJS7QS4pBD2fgxo4",
      authDomain: "kalibari-cricket-turnament2026.firebaseapp.com",
      databaseURL: "https://kalibari-cricket-turnament2026-default-rtdb.firebaseio.com",
      projectId: "kalibari-cricket-turnament2026",
      storageBucket: "kalibari-cricket-turnament2026.firebasestorage.app",
      messagingSenderId: "927915044318",
      appId: "1:927915044318:web:febe5f2b1212da85d9414f",
      measurementId: "G-D3GGN03YDV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let activeStriker = 1;
    let overRecords = [];
    let startOfOverRuns = 0;
    let stateHistory = [];

    function verifyPin() {
      const pin = document.getElementById("passInput").value;
      if (pin === "122005") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadExistingData();
        loadAdminSchedules();
      } else {
        alert("ভুল পাসওয়ার্ড! সঠিক PIN দিন।");
      }
    }

    function switchStrike() {
      activeStriker = (activeStriker === 1) ? 2 : 1;
      const name = activeStriker === 1 ? document.getElementById("bat1Name").value : document.getElementById("bat2Name").value;
      document.getElementById("activeStrikerLabel").innerText = `${name || 'Batter ' + activeStriker} on Strike`;
    }

    function saveState() {
      const snapshot = {
        runs: Number(document.getElementById("runs").value),
        wickets: Number(document.getElementById("wickets").value),
        overs: document.getElementById("overs").value,
        thisOver: document.getElementById("thisOver").value,
        activeStriker: activeStriker,
        bat1Runs: Number(document.getElementById("bat1Runs").value),
        bat1Balls: Number(document.getElementById("bat1Balls").value),
        bat2Runs: Number(document.getElementById("bat2Runs").value),
        bat2Balls: Number(document.getElementById("bat2Balls").value),
        bowlerRuns: Number(document.getElementById("bowlerRuns").value),
        bowlerWkts: Number(document.getElementById("bowlerWkts").value)
      };
      stateHistory.push(snapshot);
      if (stateHistory.length > 20) stateHistory.shift();
    }

    function undoLastAction() {
      if (stateHistory.length === 0) {
        alert("কোনো পূর্ববর্তী বলের হিস্ট্রি পাওয়া যায়নি!");
        return;
      }
      const prev = stateHistory.pop();
      document.getElementById("runs").value = prev.runs;
      document.getElementById("wickets").value = prev.wickets;
      document.getElementById("overs").value = prev.overs;
      document.getElementById("thisOver").value = prev.thisOver;
      activeStriker = prev.activeStriker;
      document.getElementById("bat1Runs").value = prev.bat1Runs;
      document.getElementById("bat1Balls").value = prev.bat1Balls;
      document.getElementById("bat2Runs").value = prev.bat2Runs;
      document.getElementById("bat2Balls").value = prev.bat2Balls;
      document.getElementById("bowlerRuns").value = prev.bowlerRuns;
      document.getElementById("bowlerWkts").value = prev.bowlerWkts;

      switchStrike();
      switchStrike();
      updateScore();
      alert("আগের বলটি Undo করা হয়েছে!");
    }

    function loadExistingData() {
      db.ref("liveMatch").once("value", (snap) => {
        const d = snap.val();
        if (d) {
          document.getElementById("startTime").value = d.startTime || "";
          document.getElementById("matchStarted").checked = d.matchStarted || false;
          document.getElementById("matchType").value = d.matchType || "League Match";
          document.getElementById("matchNo").value = d.matchNo || 1;
          document.getElementById("toss").value = d.toss || "";
          document.getElementById("battingTeam").value = d.battingTeam || "";
          document.getElementById("bowlingTeam").value = d.bowlingTeam || "";
          document.getElementById("target").value = d.target || "";
          document.getElementById("totalOvers").value = d.totalOvers || 7;
          document.getElementById("runs").value = d.runs || 0;
          document.getElementById("wickets").value = d.wickets || 0;
          document.getElementById("overs").value = d.overs || "0.0";
          document.getElementById("thisOver").value = d.thisOver || "";
          document.getElementById("bat1Name").value = d.bat1Name || "";
          document.getElementById("bat1Runs").value = d.bat1Runs || 0;
          document.getElementById("bat1Balls").value = d.bat1Balls || 0;
          document.getElementById("bat2Name").value = d.bat2Name || "";
          document.getElementById("bat2Runs").value = d.bat2Runs || 0;
          document.getElementById("bat2Balls").value = d.bat2Balls || 0;
          activeStriker = d.activeStriker || 1;
          document.getElementById("bowlerName").value = d.bowlerName || "";
          document.getElementById("bowlerOvers").value = d.bowlerOvers || "0.0";
          document.getElementById("bowlerRuns").value = d.bowlerRuns || 0;
          document.getElementById("bowlerWkts").value = d.bowlerWkts || 0;
          document.getElementById("umpire1").value = d.umpire1 || "";
          document.getElementById("umpire2").value = d.umpire2 || "";
          document.getElementById("squadA").value = d.squadA || "";
          document.getElementById("squadB").value = d.squadB || "";
          document.getElementById("status").value = d.status || "";
          overRecords = d.overRecords || [];
          startOfOverRuns = Number(d.runs || 0);
          switchStrike();
          switchStrike();
        }
      });
    }

    // Schedule Controller & Real-Time Sync
    function loadAdminSchedules() {
      db.ref("schedules").on("value", (snap) => {
        const sch = snap.val();
        const container = document.getElementById("adminScheduleList");
        if (!sch) {
          container.innerHTML = '<div style="font-size: 0.75rem; color: #64748b; text-align: center; padding: 6px;">No schedules added yet.</div>';
          return;
        }
        container.innerHTML = "";
        Object.keys(sch).forEach((key) => {
          const item = sch[key];
          const div = document.createElement("div");
          div.className = "sch-item";
          div.innerHTML = `
            <div class="sch-item-top">
              <span>Match #${item.matchNo} (${item.matchType})</span>
              <span>🕒 ${item.timeStr}</span>
            </div>
            <div style="font-size: 0.85rem; color: #fff; margin: 3px 0;">${item.teamA} vs ${item.teamB}</div>
            <div style="font-size: 0.75rem; color: #94a3b8;">Status: <strong style="color:#10b981;">${item.matchStatus || 'Upcoming'}</strong></div>
            <div class="sch-btns">
              <button style="background: #0284c7;" onclick="setScheduleAsLive('${key}')">Set as Live</button>
              <button style="background: #059669;" onclick="markScheduleStatus('${key}', 'Completed')">Completed</button>
              <button style="background: #991b1b; border-color:#ef4444;" onclick="deleteSchedule('${key}')">Delete</button>
            </div>
          `;
          container.appendChild(div);
        });
      });
    }

    function addMatchSchedule() {
      const mNo = document.getElementById("schMatchNo").value;
      const mType = document.getElementById("schType").value;
      const tA = document.getElementById("schTeamA").value;
      const tB = document.getElementById("schTeamB").value;
      const tStr = document.getElementById("schTimeStr").value;

      if (!tA || !tB) {
        alert("দুটো দলের নাম দেওয়া বাধ্যতামূলক!");
        return;
      }

      const schItem = {
        matchId: "match_" + Date.now(),
        matchNo: Number(mNo || 1),
        matchType: mType || "League Match",
        teamA: tA,
        teamB: tB,
        timeStr: tStr || "TBA",
        matchStatus: "Upcoming"
      };

      db.ref("schedules").push(schItem).then(() => {
        alert("শিডিউল সফলভাবে যোগ হয়েছে!");
        document.getElementById("schTeamA").value = "";
        document.getElementById("schTeamB").value = "";
        document.getElementById("schTimeStr").value = "";
      });
    }

    function setScheduleAsLive(key) {
      db.ref("schedules/" + key).once("value", (snap) => {
        const item = snap.val();
        if (item) {
          if (confirm(`Match #${item.matchNo}: ${item.teamA} vs ${item.teamB}-কে বর্তমান লাইভ স্কোরবোর্ডে সেট করবেন?`)) {
            document.getElementById("matchNo").value = item.matchNo;
            document.getElementById("matchType").value = item.matchType;
            document.getElementById("battingTeam").value = item.teamA;
            document.getElementById("bowlingTeam").value = item.teamB;
            document.getElementById("runs").value = 0;
            document.getElementById("wickets").value = 0;
            document.getElementById("overs").value = "0.0";
            document.getElementById("target").value = "";
            document.getElementById("thisOver").value = "";
            document.getElementById("bat1Runs").value = 0;
            document.getElementById("bat1Balls").value = 0;
            document.getElementById("bat2Runs").value = 0;
            document.getElementById("bat2Balls").value = 0;
            document.getElementById("bowlerRuns").value = 0;
            document.getElementById("bowlerWkts").value = 0;
            document.getElementById("bowlerOvers").value = "0.0";
            document.getElementById("status").value = "Match In Progress";
            document.getElementById("matchStarted").checked = true;
            overRecords = [];
            startOfOverRuns = 0;
            activeStriker = 1;
            stateHistory = [];
            
            db.ref("schedules/" + key).update({ matchStatus: "LIVE NOW" });
            updateScore();
          }
        }
      });
    }

    function markScheduleStatus(key, status) {
      db.ref("schedules/" + key).update({ matchStatus: status });
    }

    function deleteSchedule(key) {
      if (confirm("এই শিডিউলটি ডিলিট করতে চান?")) {
        db.ref("schedules/" + key).remove();
      }
    }

    function addBallToOver() {
      let parts = (document.getElementById("overs").value || "0.0").split(".");
      let ov = parseInt(parts[0]) || 0;
      let bl = parseInt(parts[1]) || 0;
      bl++;
      if (bl >= 6) { ov++; bl = 0; }
      document.getElementById("overs").value = ov + "." + bl;
    }

    function ballEvent(run, code, rotateStrike = false) {
      saveState();
      document.getElementById("runs").value = Number(document.getElementById("runs").value) + run;
      document.getElementById("bowlerRuns").value = Number(document.getElementById("bowlerRuns").value) + run;

      if (activeStriker === 1) {
        document.getElementById("bat1Runs").value = Number(document.getElementById("bat1Runs").value) + run;
        document.getElementById("bat1Balls").value = Number(document.getElementById("bat1Balls").value) + 1;
      } else {
        document.getElementById("bat2Runs").value = Number(document.getElementById("bat2Runs").value) + run;
        document.getElementById("bat2Balls").value = Number(document.getElementById("bat2Balls").value) + 1;
      }

      let currOver = document.getElementById("thisOver").value.trim();
      document.getElementById("thisOver").value = currOver ? currOver + " " + code : code;
      addBallToOver();

      if (rotateStrike) switchStrike();
      pushAutoUpdate(code);
    }

    function extraEvent(run, code) {
      saveState();
      document.getElementById("runs").value = Number(document.getElementById("runs").value) + run;
      document.getElementById("bowlerRuns").value = Number(document.getElementById("bowlerRuns").value) + run;
      let currOver = document.getElementById("thisOver").value.trim();
      document.getElementById("thisOver").value = currOver ? currOver + " " + code : code;
      pushAutoUpdate(code);
    }

    function wicketEvent() {
      saveState();
      document.getElementById("wickets").value = Number(document.getElementById("wickets").value) + 1;
      if (activeStriker === 1) {
        document.getElementById("bat1Balls").value = Number(document.getElementById("bat1Balls").value) + 1;
      } else {
        document.getElementById("bat2Balls").value = Number(document.getElementById("bat2Balls").value) + 1;
      }
      document.getElementById("bowlerWkts").value = Number(document.getElementById("bowlerWkts").value) + 1;
      let currOver = document.getElementById("thisOver").value.trim();
      document.getElementById("thisOver").value = currOver ? currOver + " W" : "W";
      addBallToOver();
      pushAutoUpdate("W");
    }

    function overCompleteEvent() {
      const currentRuns = Number(document.getElementById("runs").value);
      const currentWickets = Number(document.getElementById("wickets").value);
      const overRuns = currentRuns - startOfOverRuns;
      const overNo = document.getElementById("overs").value.split(".")[0];

      const record = {
        overNo: overNo,
        overRuns: overRuns,
        ballsSummary: document.getElementById("thisOver").value || "-",
        teamScore: `${currentRuns}/${currentWickets}`,
        bowler: `${document.getElementById("bowlerName").value} (${document.getElementById("bowlerWkts").value}/${document.getElementById("bowlerRuns").value})`,
        batter1: `${document.getElementById("bat1Name").value}: ${document.getElementById("bat1Runs").value} (${document.getElementById("bat1Balls").value})`,
        batter2: `${document.getElementById("bat2Name").value}: ${document.getElementById("bat2Runs").value} (${document.getElementById("bat2Balls").value})`
      };

      overRecords.push(record);
      startOfOverRuns = currentRuns;
      document.getElementById("thisOver").value = "";
      switchStrike();
      updateScore();
      alert(`Over ${overNo} Record Saved!`);
    }

    function setInningsBreak() {
      const totalRuns = Number(document.getElementById("runs").value);
      const target = totalRuns + 1;
      document.getElementById("status").value = `1st Innings Break! Target is ${target}`;
      document.getElementById("target").value = target;
      updateScore();
      alert(`1st Innings Break Alert Sent!`);
    }

    function resetNewMatch() {
      if (confirm("সব স্কোর মুছে কি নতুন ম্যাচ শুরু করতে চান?")) {
        document.getElementById("runs").value = 0;
        document.getElementById("wickets").value = 0;
        document.getElementById("overs").value = "0.0";
        document.getElementById("target").value = "";
        document.getElementById("thisOver").value = "";
        document.getElementById("bat1Runs").value = 0;
        document.getElementById("bat1Balls").value = 0;
        document.getElementById("bat2Runs").value = 0;
        document.getElementById("bat2Balls").value = 0;
        document.getElementById("bowlerRuns").value = 0;
        document.getElementById("bowlerWkts").value = 0;
        document.getElementById("bowlerOvers").value = "0.0";
        document.getElementById("status").value = "Match Started";
        document.getElementById("matchStarted").checked = false;
        overRecords = [];
        startOfOverRuns = 0;
        activeStriker = 1;
        stateHistory = [];
        db.ref("poll").set({ teamA: 0, teamB: 0 });
        db.ref("reactions").set({ clap: 0, six: 0, love: 0 });
        updateScore();
      }
    }

    function pushAutoUpdate(lastEvent = "") {
      const payload = {
        lastEvent: lastEvent + "_" + Date.now(),
        startTime: document.getElementById("startTime").value,
        matchStarted: document.getElementById("matchStarted").checked,
        matchType: document.getElementById("matchType").value,
        matchNo: Number(document.getElementById("matchNo").value),
        toss: document.getElementById("toss").value,
        battingTeam: document.getElementById("battingTeam").value,
        bowlingTeam: document.getElementById("bowlingTeam").value,
        target: document.getElementById("target").value ? Number(document.getElementById("target").value) : null,
        totalOvers: Number(document.getElementById("totalOvers").value || 7),
        runs: Number(document.getElementById("runs").value),
        wickets: Number(document.getElementById("wickets").value),
        overs: document.getElementById("overs").value,
        thisOver: document.getElementById("thisOver").value,
        activeStriker: activeStriker,
        bat1Name: document.getElementById("bat1Name").value,
        bat1Runs: Number(document.getElementById("bat1Runs").value),
        bat1Balls: Number(document.getElementById("bat1Balls").value),
        bat2Name: document.getElementById("bat2Name").value,
        bat2Runs: Number(document.getElementById("bat2Runs").value),
        bat2Balls: Number(document.getElementById("bat2Balls").value),
        bowlerName: document.getElementById("bowlerName").value,
        bowlerOvers: document.getElementById("bowlerOvers").value,
        bowlerRuns: Number(document.getElementById("bowlerRuns").value),
        bowlerWkts: Number(document.getElementById("bowlerWkts").value),
        umpire1: document.getElementById("umpire1").value,
        umpire2: document.getElementById("umpire2").value,
        squadA: document.getElementById("squadA").value,
        squadB: document.getElementById("squadB").value,
        status: document.getElementById("status").value,
        overRecords: overRecords
      };
      db.ref("liveMatch").update(payload);
    }

    function updateScore() {
      pushAutoUpdate();
      alert("Scoreboard Successfully Updated!");
    }
  </script>
</body>
</html>
