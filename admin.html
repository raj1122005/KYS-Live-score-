<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Score Controller</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; display: flex; justify-content: center; }
    .panel { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-top: 0; color: #1e293b; }
    label { font-size: 0.9rem; font-weight: bold; color: #475569; display: block; margin-top: 10px; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    .quick-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .quick-btns button { padding: 8px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-update { width: 100%; margin-top: 15px; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .btn-update:hover { background: #0369a1; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="panel">
    <h2>Update Match Score</h2>

    <label>Batting Team</label>
    <input type="text" id="teamA" value="Team A">

    <label>Bowling Team</label>
    <input type="text" id="teamB" value="Team B">

    <label>Runs</label>
    <input type="number" id="runs" value="0">
    <div class="quick-btns">
      <button onclick="addRun(1)">+1</button>
      <button onclick="addRun(2)">+2</button>
      <button onclick="addRun(4)">+4</button>
      <button onclick="addRun(6)">+6</button>
    </div>

    <label>Wickets</label>
    <input type="number" id="wickets" value="0">
    <div class="quick-btns" style="grid-template-columns: 1fr;">
      <button onclick="addWicket()" style="background: #fee2e2; color: #dc2626;">+ Wicket</button>
    </div>

    <label>Overs (e.g. 4.2)</label>
    <input type="text" id="overs" value="0.0">

    <label>Status / Message</label>
    <input type="text" id="status" value="1st Innings Ongoing">

    <button class="btn-update" onclick="updateScore()">Update Live Score</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCP330qxLvWwAS_ycpRJS7QS4pBD2fgxo4",
      authDomain: "kalibari-cricket-turnament2026.firebaseapp.com",
      databaseURL: "https://kalibari-cricket-turnament2026-default-rtdb.firebaseio.com",
      projectId: "kalibari-cricket-turnament2026",
      storageBucket: "kalibari-cricket-turnament2026.firebasestorage.app",
      messagingSenderId: "927915044318",
      appId: "1:927915044318:web:febe5f2b1212da85d9414f",
      measurementId: "G-D3GGN03YDV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function addRun(r) {
      const runInput = document.getElementById("runs");
      runInput.value = parseInt(runInput.value || 0) + r;
    }

    function addWicket() {
      const wInput = document.getElementById("wickets");
      wInput.value = parseInt(wInput.value || 0) + 1;
    }

    function updateScore() {
      const matchData = {
        teamA: document.getElementById("teamA").value,
        teamB: document.getElementById("teamB").value,
        runs: document.getElementById("runs").value,
        wickets: document.getElementById("wickets").value,
        overs: document.getElementById("overs").value,
        status: document.getElementById("status").value
      };

      db.ref("liveMatch").set(matchData)
        .then(() => alert("Live Score Updated!"))
        .catch((err) => alert("Error: " + err.message));
    }
  </script>
</body>
</html>
